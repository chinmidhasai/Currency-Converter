<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #5135e8;
            text-align: center;
        }

        .card {
            background: white;
            margin-top: 30px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 4px 15px #ddd;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #5135e8;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f0edff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            color: #5135e8;
        }
    </style>
</head>

<body>

<div class="container">

    <header>💱 Currency Converter</header>

    <div class="card">

        <h2>Convert Currency</h2>

        <form id="currencyForm">

            <label>Amount</label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="Enter amount"
                step="0.01"
                required
            >

            <label>From Currency</label>

            <select id="from_currency" name="from_currency">

                <option value="USD">🇺🇸 USD - US Dollar</option>
                <option value="INR">🇮🇳 INR - Indian Rupee</option>
                <option value="EUR">🇪🇺 EUR - Euro</option>
                <option value="GBP">🇬🇧 GBP - British Pound</option>
                <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
                <option value="AUD">🇦🇺 AUD - Australian Dollar</option>
                <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
                <option value="CHF">🇨🇭 CHF - Swiss Franc</option>
                <option value="CNY">🇨🇳 CNY - Chinese Yuan</option>
                <option value="SGD">🇸🇬 SGD - Singapore Dollar</option>
                <option value="AED">🇦🇪 AED - UAE Dirham</option>
                <option value="SAR">🇸🇦 SAR - Saudi Riyal</option>
                <option value="NZD">🇳🇿 NZD - New Zealand Dollar</option>
                <option value="ZAR">🇿🇦 ZAR - South African Rand</option>
                <option value="KRW">🇰🇷 KRW - South Korean Won</option>

            </select>

            <label>To Currency</label>

            <select id="to_currency" name="to_currency">

                <option value="INR">🇮🇳 INR - Indian Rupee</option>
                <option value="USD">🇺🇸 USD - US Dollar</option>
                <option value="EUR">🇪🇺 EUR - Euro</option>
                <option value="GBP">🇬🇧 GBP - British Pound</option>
                <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
                <option value="AUD">🇦🇺 AUD - Australian Dollar</option>
                <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
                <option value="CHF">🇨🇭 CHF - Swiss Franc</option>
                <option value="CNY">🇨🇳 CNY - Chinese Yuan</option>
                <option value="SGD">🇸🇬 SGD - Singapore Dollar</option>
                <option value="AED">🇦🇪 AED - UAE Dirham</option>
                <option value="SAR">🇸🇦 SAR - Saudi Riyal</option>
                <option value="NZD">🇳🇿 NZD - New Zealand Dollar</option>
                <option value="ZAR">🇿🇦 ZAR - South African Rand</option>
                <option value="KRW">🇰🇷 KRW - South Korean Won</option>

            </select>

            <button type="submit">
                💱 Convert
            </button>
            <div id="result"></div>

        </form>

    </div>

</div>
<script>



document.getElementById("currencyForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const amount = parseFloat(document.getElementById("amount").value);
    const fromCurrency = document.getElementById("from_currency").value;
    const toCurrency = document.getElementById("to_currency").value;

    const result = document.getElementById("result");

    result.innerHTML = "Converting...";

    try {

        if (fromCurrency === toCurrency) {
            result.innerHTML =
                `${amount} ${fromCurrency} = ${amount.toFixed(2)} ${toCurrency}`;
            return;
        }

        const response = await fetch(
            `https://api.frankfurter.dev/v2/rate/${fromCurrency}/${toCurrency}`
        );

        if (!response.ok) {
            throw new Error("API request failed");
        }

        const data = await response.json();

        const convertedAmount = amount * data.rate;

        result.innerHTML =
            `${amount} ${fromCurrency} = ${convertedAmount.toFixed(2)} ${toCurrency}`;

    } catch (error) {

        console.error(error);

        result.innerHTML =
            "Unable to convert currency. Please try again.";

    }

});


</script>

</body>
</html>
